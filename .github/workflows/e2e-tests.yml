name: Fiori E2E tests

# Manual only: all three suites sign in and out of the shared SAP system, so
# they are not triggered on every push or pull request.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        type: choice
        options:
          - all
          - playwright
          - python
          - robot
        default: all
      browser:
        description: Browser to use
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: chromium

permissions:
  contents: read

# All three suites drive the same SAP system. Serialize every workflow run so
# sessions do not overlap.
concurrency:
  group: fiori-trial-account
  cancel-in-progress: false

jobs:
  playwright:
    name: Playwright (TypeScript)
    if: ${{ inputs.suite == 'all' || inputs.suite == 'playwright' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://account.hanatrial.ondemand.com/' }}
      FIORI_LANGUAGE: ${{ secrets.FIORI_LANGUAGE || 'EN' }}
      FIORI_USERNAME: ${{ secrets.FIORI_USERNAME }}
      FIORI_PASSWORD: ${{ secrets.FIORI_PASSWORD }}

    steps:
      - name: Check required secrets
        run: |
          if [ -z "${FIORI_USERNAME}" ] || [ -z "${FIORI_PASSWORD}" ]; then
            echo "::error::Set FIORI_USERNAME and FIORI_PASSWORD as repository secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playwright-test/package-lock.json

      - name: Install dependencies
        working-directory: playwright-test
        run: npm ci

      - name: Install Playwright browser
        working-directory: playwright-test
        run: npx playwright install --with-deps ${{ inputs.browser }}

      - name: Run Playwright tests
        working-directory: playwright-test
        run: npx playwright test --project=${{ inputs.browser }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-test/playwright-report
            playwright-test/test-results
          if-no-files-found: ignore
          retention-days: 14

  python:
    name: pytest + Playwright
    needs: playwright
    if: ${{ !cancelled() && (inputs.suite == 'all' || inputs.suite == 'python') && (needs.playwright.result == 'success' || needs.playwright.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BROWSER: ${{ inputs.browser }}
      HEADLESS: 'true'
      BASE_URL: ${{ secrets.BASE_URL || 'https://account.hanatrial.ondemand.com/' }}
      FIORI_LANGUAGE: ${{ secrets.FIORI_LANGUAGE || 'EN' }}
      FIORI_USERNAME: ${{ secrets.FIORI_USERNAME }}
      FIORI_PASSWORD: ${{ secrets.FIORI_PASSWORD }}

    steps:
      - name: Check required secrets
        run: |
          if [ -z "${FIORI_USERNAME}" ] || [ -z "${FIORI_PASSWORD}" ]; then
            echo "::error::Set FIORI_USERNAME and FIORI_PASSWORD as repository secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            python-tests/requirements.txt
            python-tests/requirements-dev.txt

      - name: Install dependencies
        working-directory: python-tests
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browser
        working-directory: python-tests
        run: playwright install --with-deps ${{ inputs.browser }}

      - name: Run pytest
        working-directory: python-tests
        run: pytest -m fiori

      - name: Upload pytest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-report
          path: |
            python-tests/reports
            python-tests/test-results
          if-no-files-found: ignore
          retention-days: 14

  robot:
    name: Robot Framework
    needs: [playwright, python]
    if: ${{ !cancelled() && (inputs.suite == 'all' || inputs.suite == 'robot') && (needs.playwright.result == 'success' || needs.playwright.result == 'skipped') && (needs.python.result == 'success' || needs.python.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BROWSER: ${{ inputs.browser }}
      HEADLESS: 'true'
      BASE_URL: ${{ secrets.BASE_URL || 'https://account.hanatrial.ondemand.com/' }}
      FIORI_LANGUAGE: ${{ secrets.FIORI_LANGUAGE || 'EN' }}
      FIORI_USERNAME: ${{ secrets.FIORI_USERNAME }}
      FIORI_PASSWORD: ${{ secrets.FIORI_PASSWORD }}

    steps:
      - name: Check required secrets
        run: |
          if [ -z "${FIORI_USERNAME}" ] || [ -z "${FIORI_PASSWORD}" ]; then
            echo "::error::Set FIORI_USERNAME and FIORI_PASSWORD as repository secrets."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: robot-tests/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: robot-tests
        run: pip install -r requirements.txt

      - name: Install Browser library browsers
        working-directory: robot-tests
        run: rfbrowser init --with-deps ${{ inputs.browser }}

      - name: Run Robot Framework tests
        run: robot --outputdir results --xunit xunit.xml robot-tests/tests/

      - name: Upload Robot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: results
          if-no-files-found: ignore
          retention-days: 14

  pages:
    name: Publish reports to GitHub Pages
    needs: [playwright, python, robot]
    if: ${{ !cancelled() && (needs.playwright.result != 'skipped' || needs.python.result != 'skipped' || needs.robot.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Download Playwright report
        if: ${{ needs.playwright.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: site/playwright

      - name: Download pytest report
        if: ${{ needs.python.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: python-report
          path: site/python

      - name: Download Robot report
        if: ${{ needs.robot.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: robot-report
          path: site/robot

      - name: Create index page
        env:
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          ROBOT_RESULT: ${{ needs.robot.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p site
          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '  <meta charset="utf-8">'
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '  <title>Fiori E2E test reports</title>'
            echo '  <style>body{font-family:system-ui,sans-serif;max-width:52rem;margin:2rem auto;padding:0 1rem}li{margin:.5rem 0}</style>'
            echo '</head>'
            echo '<body>'
            echo '  <h1>Fiori E2E test reports</h1>'
            echo "  <p>Workflow run: <a href=\"${RUN_URL}\">${GITHUB_RUN_ID}</a></p>"
            echo '  <ul>'
            if [ "$PLAYWRIGHT_RESULT" != "skipped" ] && [ -f site/playwright/playwright-report/index.html ]; then
              echo "    <li>Playwright (${PLAYWRIGHT_RESULT}): <a href=\"playwright/playwright-report/index.html\">report</a></li>"
            fi
            if [ "$PYTHON_RESULT" != "skipped" ] && [ -f site/python/reports/report.html ]; then
              echo "    <li>pytest (${PYTHON_RESULT}): <a href=\"python/reports/report.html\">report</a></li>"
            fi
            if [ "$ROBOT_RESULT" != "skipped" ] && [ -f site/robot/report.html ]; then
              echo "    <li>Robot Framework (${ROBOT_RESULT}): <a href=\"robot/report.html\">report</a></li>"
            fi
            echo '  </ul>'
            echo '</body>'
            echo '</html>'
          } > site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
